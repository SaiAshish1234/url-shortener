<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>short.ly — URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1e;
      --border: #2a2a30;
      --accent: #7c6ff7;
      --accent-dim: #3d3880;
      --text: #f0f0f4;
      --muted: #888896;
      --success: #34d399;
      --error: #f87171;
      --radius: 10px;
      --font: 'JetBrains Mono', 'Fira Code', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container { width: 100%; max-width: 560px; }

    header { text-align: center; margin-bottom: 3rem; }
    .logo {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    .tagline { font-size: 0.85rem; color: var(--muted); margin-top: 6px; letter-spacing: 0.04em; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus { border-color: var(--accent); }
    input[type="url"]::placeholder { color: var(--muted); }

    button {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.85; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .result {
      margin-top: 1.25rem;
      display: none;
    }
    .result.visible { display: block; }

    .result-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .result-url {
      flex: 1;
      color: var(--success);
      font-size: 1rem;
      word-break: break-all;
      text-decoration: none;
    }
    .result-url:hover { text-decoration: underline; }

    .copy-btn {
      background: var(--accent-dim);
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .error-msg {
      margin-top: 0.75rem;
      color: var(--error);
      font-size: 0.82rem;
      display: none;
    }
    .error-msg.visible { display: block; }

    .history { margin-top: 2rem; }
    .history-title {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      animation: fadeIn 0.3s ease;
    }
    .history-short { color: var(--accent); flex-shrink: 0; }
    .history-orig { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    footer { margin-top: 2.5rem; text-align: center; font-size: 0.78rem; color: var(--muted); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">short<span>.</span>ly</div>
      <div class="tagline">serverless · auto-scaling · free tier friendly</div>
    </header>

    <div class="card">
      <div class="input-row">
        <input type="url" id="url-input" placeholder="https://your-long-url.com/goes/here" autocomplete="off" />
        <button id="shorten-btn" onclick="shorten()">Shorten →</button>
      </div>
      <div class="error-msg" id="error-msg"></div>
      <div class="result" id="result">
        <div class="result-box">
          <a class="result-url" id="result-link" href="#" target="_blank"></a>
          <button class="copy-btn" onclick="copyResult()">Copy</button>
        </div>
      </div>

      <div class="history" id="history" style="display:none">
        <div class="history-title">recent links</div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>

    <footer>Built on AWS Lambda · DynamoDB · Terraform · GitHub Actions</footer>
  </div>

  <script>
    // Replace this with your actual API Gateway URL after deployment
    const API_URL = "https://85yw1disj9.execute-api.us-east-1.amazonaws.com";

    const history = [];

    async function shorten() {
      const input = document.getElementById("url-input");
      const btn = document.getElementById("shorten-btn");
      const url = input.value.trim();

      showError("");
      hideResult();

      if (!url) { showError("Please enter a URL."); return; }
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        showError("URL must start with http:// or https://");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Shortening...";

      try {
        const res = await fetch(`${API_URL}/shorten`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || "Something went wrong."); return; }

        showResult(data.short_url);
        addHistory(data.short_url, url);
        input.value = "";
      } catch (err) {
        showError("Network error — is the API URL configured?");
      } finally {
        btn.disabled = false;
        btn.textContent = "Shorten →";
      }
    }

    function showResult(url) {
      const el = document.getElementById("result");
      const link = document.getElementById("result-link");
      const apiUrl = url.replace("https://d1wahrswrbzjbf.cloudfront.net", "https://85yw1disj9.execute-api.us-east-1.amazonaws.com");
      link.href = apiUrl;
      link.textContent = apiUrl;
      el.classList.add("visible");
    }

    function hideResult() {
      document.getElementById("result").classList.remove("visible");
    }

    function showError(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.classList.toggle("visible", !!msg);
    }

    function copyResult() {
      const url = document.getElementById("result-link").textContent;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy", 1500);
      });
    }

    function addHistory(short, original) {
      history.unshift({ short, original });
      if (history.length > 5) history.pop();
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById("history");
      const list = document.getElementById("history-list");
      container.style.display = "block";
      list.innerHTML = history.map(h => `
        <div class="history-item">
          <a class="history-short" href="${h.short}" target="_blank">${h.short}</a>
          <span class="history-orig">${h.original}</span>
        </div>
      `).join("");
    }

    document.getElementById("url-input").addEventListener("keydown", e => {
      if (e.key === "Enter") shorten();
    });
  </script>
</body>
</html>
